# The `golden` tag runs only when CI asks for it (the "Build APK" workflow's
# `goldens` input is set to `check` or `update`), so a Flutter release that
# moves a glyph by one shade doesn't fail the regular build. `tour` is step
# 8.3's prototype screen tour, opt-in the same way.
#
# Normal `flutter test` uses --exclude-tags to skip both. A `skip:` entry here
# would skip them even when --tags asks for them, so this file only declares
# them (needed so --tags/--exclude-tags recognise them).
tags:
  golden:
  tour:
