name: dailylife
description: "Daily Life (আমার জীবন): private, offline-first personal life manager."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^3.4.0
  go_router: ^18.1.0
  shared_preferences: ^2.5.0
  lucide_icons_flutter: ^4.0.2
  drift: ^2.35.3
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.6.0
  # 22.x: 23.0 needs AGP 9.1.1 and compileSdk 37, newer than Flutter's template.
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.0
  file_picker: ^13.3.2
  pdfx: ^2.11.0
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    # The prototype's seed data, copied unchanged from daily-life-kit/data/.
    - assets/sample_data.json
  fonts:
    - family: HindSiliguri
      fonts:
        - asset: assets/fonts/HindSiliguri-Light.ttf
          weight: 300
        - asset: assets/fonts/HindSiliguri-Regular.ttf
          weight: 400
        - asset: assets/fonts/HindSiliguri-Medium.ttf
          weight: 500
        - asset: assets/fonts/HindSiliguri-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HindSiliguri-Bold.ttf
          weight: 700
