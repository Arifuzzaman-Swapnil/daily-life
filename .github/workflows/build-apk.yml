name: Build APK

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Analyze, test, build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    env:
      # SHA-256 of the stable debug signing certificate (public: it's inside every APK).
      # The keystore itself lives in the DEBUG_KEYSTORE_B64 repo secret.
      EXPECTED_CERT_SHA256: b68e268220eb98b1024ea76cbef704013b691e5d113f4c5d9f4fb711d61a5ef3
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install stable debug signing key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "::warning::DEBUG_KEYSTORE_B64 secret is missing; the APK will be signed with a throwaway key and won't update over earlier installs."
            exit 0
          fi
          for dir in "$HOME/.android" ${ANDROID_USER_HOME:+"$ANDROID_USER_HOME"}; do
            mkdir -p "$dir"
            echo "$DEBUG_KEYSTORE_B64" | base64 --decode > "$dir/debug.keystore"
          done
          echo "HAS_STABLE_KEY=true" >> "$GITHUB_ENV"

      - name: Fill in missing platform files
        run: flutter create --platforms=android --org com.intelleqt --project-name dailylife .

      - name: Flutter version
        run: flutter --version

      - name: Get packages
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK (signed with the debug key)
        run: flutter build apk --release

      - name: Verify signing certificate
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt
          ACTUAL=$(grep -m1 'certificate SHA-256 digest' certs.txt | awk '{print $NF}')
          echo "Signing cert SHA-256: $ACTUAL"
          if [ "${HAS_STABLE_KEY:-}" = "true" ] && [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK was not signed with the stable debug key (expected $EXPECTED_CERT_SHA256)."
            exit 1
          fi
          ls -l "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: daily-life-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
