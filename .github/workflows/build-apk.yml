name: Build APK

on:
  push:
  workflow_dispatch:
    inputs:
      goldens:
        description: 'Golden tests: off (push default), check (compare to baselines), update (regenerate PNGs — upload them as the "goldens" artifact).'
        type: choice
        default: 'off'
        options: ['off', 'check', 'update']
      tour:
        description: 'Prototype screen tour (step 8.3): render every kit screen as a PNG artifact for a side-by-side with daily-life-kit/screenshots/.'
        type: boolean
        default: false

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Analyze, test, build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    env:
      # SHA-256 of the stable debug signing certificate (public: it's inside every APK).
      # The keystore itself lives in the DEBUG_KEYSTORE_B64 repo secret.
      EXPECTED_CERT_SHA256: b68e268220eb98b1024ea76cbef704013b691e5d113f4c5d9f4fb711d61a5ef3
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/pubspec.yaml', 'app/android/**/*.gradle*', 'app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install stable debug signing key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "::warning::DEBUG_KEYSTORE_B64 secret is missing; the APK will be signed with a throwaway key and won't update over earlier installs."
            exit 0
          fi
          # Pin the Android user dir so the Android Gradle Plugin's default debug
          # keystore is exactly the file written here.
          USER_DIR="$HOME/.android"
          mkdir -p "$USER_DIR"
          echo "$DEBUG_KEYSTORE_B64" | base64 --decode > "$USER_DIR/debug.keystore"
          echo "ANDROID_USER_HOME=$USER_DIR" >> "$GITHUB_ENV"
          echo "HAS_STABLE_KEY=true" >> "$GITHUB_ENV"
          # Fail early if Java can't read it with the standard debug credentials.
          keytool -list -v -keystore "$USER_DIR/debug.keystore" -storepass android -alias androiddebugkey \
            | grep -E "Alias name|Keystore type|SHA256:" || { echo "::error::debug keystore is unreadable"; exit 1; }

      - name: Fill in missing platform files
        run: flutter create --platforms=android --org com.intelleqt --project-name dailylife .

      - name: Flutter version
        run: flutter --version

      - name: Get packages
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      # Drift tables/DAOs -> *.g.dart. Not committed: there is no local SDK to run it.
      - name: Generate code (drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Goldens are opt-in: the default push run skips the `golden` tag so a
      # Flutter release moving an anti-aliased pixel doesn't fail the build.
      # Dispatch the workflow with `goldens=check` to compare against the
      # committed baselines, or `goldens=update` to regenerate them (the
      # generated PNGs are uploaded as the "goldens" artifact; commit them).
      - name: Goldens (check or update)
        if: ${{ inputs.goldens != '' && inputs.goldens != 'off' }}
        run: |
          if [ "${{ inputs.goldens }}" = "update" ]; then
            flutter test --tags golden --update-goldens
          else
            flutter test --tags golden
          fi

      - name: Upload golden baselines (update run)
        if: ${{ always() && inputs.goldens == 'update' }}
        uses: actions/upload-artifact@v7
        with:
          name: goldens
          path: app/test/goldens/_baselines/
          if-no-files-found: error
          retention-days: 30

      - name: Upload golden failure diffs (check run)
        if: ${{ failure() && inputs.goldens == 'check' }}
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: app/**/failures/**
          if-no-files-found: ignore
          retention-days: 14

      # DL_SAMPLE_DATA seeds the prototype's sample data on first launch of this
      # test build. A real release builds without it and starts empty.
      - name: Build release APK (signed with the debug key)
        run: flutter build apk --release --dart-define=DL_SAMPLE_DATA=true

      - name: Verify signing certificate
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt
          ACTUAL=$(grep -m1 'certificate SHA-256 digest' certs.txt | awk '{print $NF}')
          echo "Signing cert SHA-256: $ACTUAL"
          if [ "${HAS_STABLE_KEY:-}" = "true" ] && [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK was not signed with the stable debug key (expected $EXPECTED_CERT_SHA256)."
            echo "--- Android env ---"; env | grep -i android | sort
            echo "--- debug keystores on disk ---"
            find / -xdev -name 'debug.keystore' 2>/dev/null | while read -r ks; do
              ls -l --time-style=full-iso "$ks"
              keytool -list -v -keystore "$ks" -storepass android 2>/dev/null | grep -m1 'SHA256:' || echo "  (unreadable)"
            done
            exit 1
          fi
          ls -l "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: daily-life-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
